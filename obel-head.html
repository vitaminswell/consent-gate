<!-- ==========================================================
     CONSENT GATE — OBEL Foundation
     Site settings > Custom code > Head code, ABOVE everything
     else already in that field (Swiper, Lumos, Finsweet).

     Theme variables are mapped onto the site's Lumos tokens so
     the blocked-embed placeholder inherits the current colour
     theme rather than sitting there in default greys.
     ========================================================== -->
<link rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/vitaminswell/consent-gate@v1.0.5/dist/consent-gate.css">

<style>
  :root {
    --cg-border: var(--_theme---border);
    --cg-surface: var(--_theme---background-2);
    --cg-text: var(--_theme---text);
    --cg-text-muted: var(--_theme---text-faded);
    --cg-radius: var(--radius--round, 0);
    --cg-font-size: var(--_typography---font-size--text-small);
  }
</style>

<script>
  /* Danish-language placeholder; the banner and panel text live in
     the Designer. Vimeo is added explicitly because OBEL embeds it
     via player.vimeo.com paths the default list already covers —
     kept here as the place to add anything new. */
  window.ConsentGateConfig = {
    text: {
      placeholder: "Dette indhold hostes af en tredjepart, der sætter cookies.",
      placeholderButton: "Tillad og indlæs",
      bannerLabel: "Cookie-samtykke"
    }
  };
</script>

<script src="https://cdn.jsdelivr.net/gh/vitaminswell/consent-gate@v1.0.5/dist/consent-gate.min.js"
        data-cg-cookie="obel-cc"
        data-cg-categories="analytics,personalization,marketing"
        data-cg-lifetime="180"
        data-cg-version="1"></script>

<!-- ==========================================================
     WEBFLOW ANALYZE — consent bridge
     ------------------------------------------------------------
     Webflow Analyze is first-party and injected by Webflow's own
     runtime, so none of the gate's three blocking layers touch it:
     it is not a tagged script, not a third-party iframe, and not a
     Consent Mode signal. It is gated only through wf.*UserTracking,
     so without this bridge Analyze keeps tracking after Reject All.

     wf is a global published by the Analyze runtime, which loads
     after this head code — hence the wait rather than a direct call.
     ========================================================== -->
<script>
(function () {
  // Which consent-gate category governs Webflow Analyze.
  var CATEGORY = "analytics";

  var wfRef = null;

  function applyChoice() {
    // Re-check on every call: the object was incomplete once and
    // could be replaced again, and throwing in here would leave the
    // visitor's choice unrecorded with nothing but a console error.
    if (!usable(wfRef) || !window.ConsentGate) return;

    var granted = !!window.ConsentGate.has(CATEGORY);
    var current = wfRef.getUserTrackingChoice();

    // Re-issuing the same choice on every page view would restart
    // tracking each navigation, so only act on an actual change.
    if (granted && current !== "allow") {
      wfRef.allowUserTracking({ activate: true });
    } else if (!granted && current !== "deny") {
      // Undecided counts as deny: Webflow must not track before
      // the visitor has chosen. No reload option — consent-gate
      // owns reload decisions, and two reloads per click is a bug.
      wfRef.denyUserTracking();
    }
  }

  // Gate on the method actually needed, not on wf.ready. The docs
  // wrap every example in wf.ready(), but it is not guaranteed to
  // exist on the published global — and requiring it meant the poll
  // below never resolved, so the bridge silently did nothing while
  // wf.denyUserTracking() worked perfectly when called by hand.
  // Every method this bridge calls, not just the one it reads. The
  // Analyze snippet publishes wf in stages: getUserTrackingChoice
  // lands first, allowUserTracking and denyUserTracking a moment
  // later. Gating on the reader alone latched onto a half-built
  // object and threw "denyUserTracking is not a function".
  function usable(wf) {
    return !!wf &&
      typeof wf.getUserTrackingChoice === "function" &&
      typeof wf.allowUserTracking === "function" &&
      typeof wf.denyUserTracking === "function";
  }

  function attempt(callback) {
    var wf = window.wf;
    if (!usable(wf)) return false;
    if (typeof wf.ready === "function") {
      wf.ready(function () { callback(wf); });
    } else {
      callback(wf);
    }
    return true;
  }

  function whenWebflowReady(callback) {
    if (attempt(callback)) return;
    var tries = 0;
    var timer = setInterval(function () {
      if (attempt(callback) || ++tries > 100) {
        clearInterval(timer); // resolved, or ~10s: Analyze not on this page
      }
    }, 100);
  }

  // attempt() has already dealt with wf.ready, so the callback must
  // not call it again — doing so threw on every poll tick.
  whenWebflowReady(function (wf) {
    wfRef = wf;
    applyChoice();
  });

  // Fires on accept, reject, granular submit and the JS API alike.
  document.addEventListener("consentgate:change", applyChoice);
})();
</script>
